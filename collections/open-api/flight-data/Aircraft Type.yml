info:
  name: Aircraft Type
  type: http
  seq: 2

http:
  method: GET
  url: https://api.aviationstack.com/v1/aircraft_types?access_key={{process.env.flight-key}}
  params:
    - name: access_key
      value: "{{process.env.flight-key}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
