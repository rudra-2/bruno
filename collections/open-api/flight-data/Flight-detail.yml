info:
  name: Flight-detail
  type: http
  seq: 1

http:
  method: GET
  url: https://api.aviationstack.com/v1/flights?access_key={{process.env.flight-key}}&limit=100&offset=0&callback=MY_CALLBACK
  params:
    - name: access_key
      value: "{{process.env.flight-key}}"
      type: query
    - name: limit
      value: "100"
      type: query
    - name: offset
      value: "0"
      type: query
    - name: callback
      value: MY_CALLBACK
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
